# SAT-SA assessment rules — supervisors tune these without touching code.
# All thresholds are explicit and auditable: every finding traces back
# to a specific rule and value here.

escalation:
  required_severities: ["HIGH", "CRITICAL"]

sla_minutes:
  ack:
    LOW: 60
    MEDIUM: 30
    HIGH: 15
    CRITICAL: 10
  triage:
    LOW: 480
    MEDIUM: 240
    HIGH: 90
    CRITICAL: 45

execution_gaps:
  # Ack delay this many multiples of SLA counts as SLOW_TRIAGE
  slow_triage_sla_multiplier: 2.5
  # Investigation duration below this fraction of the SLA triage target
  # (for HIGH/CRITICAL only) counts as FAST_CLOSURE
  fast_closure_sla_fraction: 0.15
  # Minimum investigation duration (minutes) below which a HIGH/CRITICAL
  # closure is always considered suspicious, regardless of SLA fraction
  fast_closure_floor_minutes: 10
  # A finding only fires if actual duration is at least this many
  # minutes BELOW the computed threshold — prevents borderline cases
  # (e.g. 13.0 vs a 13.5-minute threshold) from being flagged as if
  # they were the same as a genuinely suspicious 3-minute closure.
  fast_closure_min_margin_minutes: 5
  # Resolution-reason text similarity threshold (0-1) for flagging
  # repetitive / template-driven investigations on the same asset
  repetitive_investigation_similarity: 0.9
  repetitive_investigation_min_occurrences: 3
  # Analyst alert-volume z-score (vs. peers in the same SOC) above which
  # ANALYST_OVERLOAD fires
  analyst_overload_zscore_threshold: 2.0

  # ACK_WITHOUT_INVESTIGATION — severities for which closing an alert
  # with no INVESTIGATION_STARTED event ever recorded is a gap.
  # Deliberately NOT all severities: triaging a LOW alert to closure
  # without opening a formal investigation is normal SOC practice, and
  # flagging it would bury the cases that matter. Widen only if the
  # entity's own policy requires an investigation record at that tier.
  ack_without_investigation_severities: ["HIGH", "CRITICAL"]

  # REPEATED_ALERT_WITHOUT_REMEDIATION — how many alerts of the same
  # category must recur on one asset before absence of remediation
  # evidence is treated as a root-cause concern.
  repeated_alert_min_occurrences: 3
  # Case resolution_reason text matching any of these (case-insensitive
  # substring) counts as evidence that remediation actually occurred.
  # Matched against resolution_reason because that is the only field in
  # the standard submission that records WHAT was done; the actions
  # table records that an analyst acted, not that the root cause was
  # fixed.
  repeated_alert_remediation_keywords:
    ["remediated", "contained", "blocked", "patched", "isolated", "quarantined"]

negative_space:
  # Telemetry coverage below this percentage is a coverage gap
  min_expected_coverage_pct: 70
  # Entity-level alert volume more than this many std-devs below the
  # mean FOR ITS PEER GROUP is flagged as unexpectedly low activity.
  #
  # The baseline is the peer group defined by benchmarking.peer_group_by
  # above — not the whole submission. Sectors differ in natural alert
  # volume by an order of magnitude, and pooling them inflates the
  # standard deviation until genuine blind spots are masked: a
  # healthcare entity at 150 alerts against healthcare peers averaging
  # ~910 scores -0.93 pooled with energy entities, but -1.50 within its
  # own sector.
  #
  # A peer group smaller than 3 entities is not assessed at all: a
  # standard deviation over two entities describes nothing.
  low_activity_zscore_threshold: -1.5
  # Category present for >= this fraction of an entity's PEER GROUP but
  # absent for that entity is flagged as a missing alert category.
  #
  # Peer-relative for the same reason as the volume test above.
  # "Expected" only means something against comparable entities: an
  # energy CSE not reporting a category every healthcare CSE reports
  # says nothing. Pooling sectors both invents gaps and hides them.
  #
  # A peer group below 3 entities is not assessed: "present for a
  # strong majority of peers" is not a claim two entities can support.
  missing_category_peer_presence_fraction: 0.6
  # MISSING_ESCALATION_RECORDS — fraction of an entity's HIGH/CRITICAL
  # alerts that must carry SOME escalation record (initiated or not)
  # before record-keeping is considered adequate. Below this, the
  # entity does not appear to keep escalation records reliably.
  #
  # This replaces an earlier all-or-nothing test that only fired when
  # an entity had literally zero escalation rows. Real poor
  # record-keeping is sparse, not absent — an entity logging 6% of the
  # escalations it should has a record-keeping gap that the old rule
  # scored identically to a perfectly compliant one.
  escalation_record_coverage_fraction: 0.5
  # Minimum HIGH/CRITICAL alerts before the coverage test is applied,
  # so a handful of alerts cannot produce a coverage "finding".
  escalation_record_min_high_crit_alerts: 10

  # A SOC needs at least this many cases before MISSING_INVESTIGATIONS
  # is evaluated (avoids false positives on tiny/new entities)
  missing_investigation_min_cases: 5
  # Fraction of a SOC's cases with blank investigation_notes above which
  # MISSING_INVESTIGATIONS fires
  missing_investigation_empty_fraction: 0.5

evidence_completeness:
  # How much of a submission the checks could actually run against,
  # reported ALONGSIDE the risk score and never folded into it.
  #
  # Most execution-gap rules read a record and ask whether it shows the
  # right thing happened. Where the record was never written the rule
  # cannot fire, so an entity keeping poor records accumulates fewer
  # findings than one keeping good records over identical behaviour —
  # and therefore scores better. Measured on the reference dataset: an
  # entity seeded with poor record-keeping scored 50.6 against 56.4 for
  # a "typical" entity whose seeded rates are worse on no dimension at
  # all.
  #
  # This does not reweight anything. It publishes the denominator, so a
  # low score can be read correctly.
  #
  # Coverage below this fraction is reported as materially limiting what
  # could be examined. NOT a finding: absent records may reflect an
  # incomplete export or a system that stores them elsewhere.
  min_coverage_fraction: 0.5

benchmarking:
  # Peer group key: "sector" groups entities by soc sector; "all" uses
  # the whole dataset as one peer group (use "all" only for very small
  # pilot runs where per-sector n would be 1)
  peer_group_by: "sector"

scoring:
  # Weights for the composite entity risk score. Kept simple and
  # linear on purpose — a supervisor must be able to recompute this
  # score by hand from the underlying indicator counts.
  weights:
    missed_escalation: 3.0
    fast_closure: 2.0
    slow_triage: 1.0
    missing_evidence: 1.5
    repetitive_investigation: 2.0
    reopened_case: 1.0
    telemetry_gap: 3.0
    low_activity_outlier: 2.0
    # Key must equal finding_type.lower(): the detector emits
    # MISSING_ALERT_CATEGORY, so this was previously unmatched and
    # the rule silently scored 0. tests/test_detectors.py asserts
    # every emitted finding_type has a weight here.
    missing_alert_category: 1.5
    analyst_overload: 1.5
    missing_escalation_records: 2.5
    missing_investigations: 2.0
    # Closing a HIGH/CRITICAL alert with no investigation record at all
    # is weighted above fast_closure (2.0): a fast closure at least has
    # an investigation to inspect, this one has none.
    ack_without_investigation: 2.5
    # Same asset alerting repeatedly with no remediation evidence —
    # weighted with repetitive_investigation, both being root-cause
    # /depth-of-work concerns rather than single-alert failures.
    repeated_alert_without_remediation: 2.0
  # Normalize indicator counts per 100 alerts/cases before weighting,
  # so larger entities aren't penalized purely for higher volume.
  normalize_per: 100

review_queue:
  # How many CASES to surface by global priority. Every finding in a
  # selected case is shown, so the row count exceeds this number.
  top_n: 25

  # Cases each entity contributes regardless of global rank, so a few
  # high-volume CSEs cannot starve the rest of the portfolio.
  #
  # Measured on a 30-entity submission before this existed: 21 of 30
  # entities received no queue item at all, including one ranked 3rd by
  # risk score with 202 CRITICAL findings. A supervisor responsible for
  # 30 CSEs would never have looked at 21 of them.
  #
  # 1 means "the worst case at every CSE". Set to 0 to restore a purely
  # global queue. An entity with no findings contributes nothing either
  # way — a clean entity is absent from the queue, and that absence is
  # the correct supervisory statement about it.
  per_entity_cases: 1
  # Extra weight given to findings from an entity's highest-severity
  # alerts when ranking the queue (on top of the base scoring weight)
  severity_boost:
    CRITICAL: 2.0
    HIGH: 1.5
    MEDIUM: 1.0
    LOW: 0.5

llm_narration:
  # Offline explanation layer. Narrates findings that are ALREADY
  # decided — never used to decide one. Disable it entirely and the
  # assessment output is identical in substance.
  #
  # Default OFF. The deterministic assessment is the product; the
  # explanation layer is an optional aid that must never be a
  # precondition for running one.
  enabled: false

  # ollama   - DEFAULT: zero-configuration local runtime, discovered
  #            automatically. The operator enters no paths at all.
  # llamacpp - STRICT AIR-GAP: a local .gguf data file, no service to
  #            install. Use where a resident daemon is not permitted.
  # mock     - built-in deterministic sample explainer, no model (tests/demo)
  #
  # Override for a single run with SATSA_NARRATION_BACKEND=mock, which
  # is what the test suite and UI smoke tests use so that no automated
  # run can ever spin up a multi-gigabyte model.
  backend: "ollama"

  # --- llamacpp (strict air-gap path only) ---
  # Absolute path to the GGUF model file. Read by LlamaCppBackend and
  # by nothing else: the default Ollama path never consults it, which
  # is why the settings screen does not ask for it. In an air-gapped
  # deployment this file arrives on the same media as the dataset;
  # updating the model means replacing this file and restarting.
  model_path: ""
  context_size: 4096
  max_tokens: 320
  # 0 = let llama.cpp choose based on the host CPU
  threads: 0

  # --- ollama (default path) ---
  # Ollama's own loopback default. Discovered, not asked for; present
  # here only so a site that has moved the port can correct it. Never
  # point this at another machine — SAT-SA is a local-only tool.
  base_url: "http://localhost:11434"

  # Model identifier. qwen2.5:7b is the balanced default.
  # NOT qwen2.5:14b: at ~9 GB resident it is unusable on the 8th-gen
  # i5 / 20 GB development hardware, and a default that hangs the
  # machine it ships on is not a default.
  model: "qwen2.5:7b"

  temperature: 0.1
  # Generation budget. CPU inference of a 7B model runs 1-4 minutes per
  # call; a short timeout here does not make narration faster, it just
  # discards slow-but-valid answers and silently falls back.
  timeout_seconds: 180
  # Availability probe budget — deliberately tiny and separate. A dead
  # backend must report itself dead in about a second, not in three
  # minutes with the UI blocked behind it.
  availability_timeout_seconds: 3

  # --- scope: what actually gets explained ---
  # The current dataset yields ~1,480 findings. Explaining all of them
  # is hours of CPU for output nobody reads, so narration follows the
  # review queue's existing supervisory ranking and stops at a limit.
  # Note that severity_scope alone bounds almost nothing: the queue is
  # already ~100% CRITICAL/HIGH by construction. max_explanations is
  # the lever that actually keeps a run finite.
  max_explanations: 10
  # critical | critical_high | critical_high_medium | all
  severity_scope: "critical_high"
  # Only explain queue items at or above this rank; null = no limit.
  max_queue_rank: null

capability_mapping:
  # Maps every detection rule to one of the eight supervisory capability
  # areas the official problem statement names. The mapping is a plain
  # lookup — deterministic, auditable, and editable by a supervisor
  # without touching code. No model is involved in deciding it.
  #
  # Each rule has exactly ONE primary capability. A finding often informs
  # several, but attributing it to several would double-count it in every
  # per-capability total and make the arithmetic impossible to check by
  # hand. Secondary areas are recorded separately, for context only, and
  # never scored.
  #
  # `why` states the reasoning for each assignment, so a supervisor can
  # disagree with a mapping on its merits rather than having to guess at
  # the intent.

  areas:
    THREAT_DETECTION:
      label: "Threat Detection"
      question: "Can the entity see what is happening in its estate?"
    INVESTIGATION:
      label: "Investigation"
      question: "When something is seen, is it actually examined?"
    ESCALATION:
      label: "Escalation"
      question: "Does what matters reach the people who must act on it?"
    INCIDENT_RESPONSE:
      label: "Incident Response"
      question: "Are problems resolved, or do they recur?"
    SECURITY_OPERATIONS:
      label: "Security Operations"
      question: "Is the operation resourced and running to its own targets?"
    GOVERNANCE_OVERSIGHT:
      label: "Governance and Oversight"
      question: "Is there a record an examiner can supervise against?"
    OPERATIONAL_DISCIPLINE:
      label: "Operational Discipline"
      question: "Is the work genuine, or shaped to satisfy metrics?"
    CYBER_RESILIENCE:
      label: "Cyber Resilience"
      question: "Would the entity withstand and recover from a real event?"

  rules:
    TELEMETRY_GAP:
      primary: THREAT_DETECTION
      secondary: [CYBER_RESILIENCE]
      why: >-
        An expected telemetry source below its coverage threshold is a
        blind spot: whatever happens there cannot be detected at all.

    MISSING_ALERT_CATEGORY:
      primary: THREAT_DETECTION
      secondary: []
      why: >-
        A threat class that peers detect and this entity never reports
        points at detection coverage rather than at a quieter estate.

    FAST_CLOSURE:
      primary: INVESTIGATION
      secondary: [OPERATIONAL_DISCIPLINE]
      why: >-
        A high-severity alert closed faster than the work could
        credibly have been done speaks to the depth of investigation.

    MISSING_EVIDENCE:
      primary: INVESTIGATION
      secondary: [GOVERNANCE_OVERSIGHT]
      why: >-
        Investigation without a retained evidence record cannot be
        verified afterwards, by a supervisor or by the entity itself.

    MISSED_ESCALATION:
      primary: ESCALATION
      secondary: [INCIDENT_RESPONSE]
      why: >-
        An alert the entity's own policy required to be escalated, with
        a record showing it was not, is escalation failing on its own
        terms.

    REOPENED_CASE:
      primary: INCIDENT_RESPONSE
      secondary: [INVESTIGATION]
      why: >-
        A case closed and then reopened indicates the first resolution
        did not hold. Reopening can also reflect legitimate new
        information, which is why it is an indicator and not a fault.

    REPEATED_ALERT_WITHOUT_REMEDIATION:
      primary: INCIDENT_RESPONSE
      secondary: [CYBER_RESILIENCE]
      why: >-
        The same condition recurring on one asset with no remediation
        recorded is response treating symptoms rather than causes.

    SLOW_TRIAGE:
      primary: SECURITY_OPERATIONS
      secondary: [OPERATIONAL_DISCIPLINE]
      why: >-
        Acknowledgement well beyond the entity's own SLA is an
        operational throughput and staffing question before it is
        anything else.

    ANALYST_OVERLOAD:
      primary: SECURITY_OPERATIONS
      secondary: []
      why: >-
        Alert volume concentrated on one analyst relative to peers in
        the same SOC is a resourcing and workload-distribution
        question, not a judgement on that analyst.

    MISSING_ESCALATION_RECORDS:
      primary: GOVERNANCE_OVERSIGHT
      secondary: [ESCALATION]
      why: >-
        Where escalation records are largely absent, whether escalation
        happened cannot be determined either way. That is a
        record-keeping failure before it is an escalation failure, and
        it is what makes the entity unsupervisable.

    MISSING_INVESTIGATIONS:
      primary: GOVERNANCE_OVERSIGHT
      secondary: [INVESTIGATION]
      why: >-
        Cases closed with no investigation notes at all leave nothing
        for an examiner, or the entity's own management, to review.

    ACK_WITHOUT_INVESTIGATION:
      primary: OPERATIONAL_DISCIPLINE
      secondary: [INVESTIGATION]
      why: >-
        Acknowledging an alert and closing it with no investigation in
        between satisfies response-time metrics while leaving the alert
        unexamined — the problem statement's example of behaviour
        shaped to meet a measure rather than to reduce risk.

    REPETITIVE_INVESTIGATION:
      primary: OPERATIONAL_DISCIPLINE
      secondary: [INVESTIGATION]
      why: >-
        Byte-identical investigation notes across many cases indicate
        template-driven handling rather than case-specific work.

    LOW_ACTIVITY_OUTLIER:
      primary: CYBER_RESILIENCE
      secondary: [THREAT_DETECTION]
      why: >-
        Alert volume far below comparable entities more often reflects
        limited monitoring reach than a genuinely quieter estate, and
        speaks to whether the entity would see a real event at all.
